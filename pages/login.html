<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/header-foter.css">
    <link rel="stylesheet" href="/css/login.css">
    <script src="/js/baseElements/baseElements.js" type="module"></script>
    <script src="/js/login/logIn.js" type="module"></script>
</head>
<body>
    <div class="preloader">
        <div class="preloader-content"></div>
    </div>
    <header id="header-placeholder"></header>
    <div id="mobile-menu-placeholder"></div>
    <main>
        <section class="banner-container">
            <div class="banner-container-text">
                <h3>PASSWORD PROTECTED</h3>
                <h1>Log in Page</h1>
            </div>
        </section>
        <section class="auth-section">
            <div>
                <h3>Enter into Beauty</h3>
                <h2>Log in</h2>
            </div>
            <div class="auth-form">
                <div class="input-wrapper">
                    <img class="icon" src="/img/user-register.svg" alt="user icon">
                    <input class="card-input" type="text" placeholder="Nickname" id="nickname">
                    <span class="error-message"></span>
                </div>
                <div class="input-wrapper">
                    <img class="icon" src="/img/book-register.svg" alt="lock icon">
                    <input class="card-input" type="password" placeholder="Password" id="password">
                    <span class="error-message"></span>
                </div>
                <button class="check-in-button" id="submit-button">Log in</button>
                <h3><a href="registar.html" id="toggle-form">Check in</a></h3>
            </div>
        </section>
    </main>
    <footer id="footer-placeholder"></footer>
</body>
</html>
