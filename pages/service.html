<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="service.pageTitle">Document</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/header-foter.css">
    <link rel="stylesheet" href="/css/service.css">
    <script src="/js/baseElements/baseElements.js" type="module" ></script>
    <script src="\js\service\service.js" type="module"></script>
</head>
<body>
    <div class="preloader">
        <div class="preloader-content"></div>
    </div>
    <header id="header-placeholder"></header>
    <div id="mobile-menu-placeholder"></div>
    <main>
        <section class="banner-container">
            <div class="banner-container-text">
                <h3 data-i18n="service.banner.subtitle">THE SERVICE</h3>
                <h1 data-i18n="service.banner.title">Beauty Service</h1>
            </div>
        </section>
        <section class="service-container">
            <img class="service-img" src="" alt="service" data-i18n="[alt]service.imageAlt">
            <div class="service-info">
                <div>
                    <h3 class="service-category" data-i18n="service.details.category"></h3>
                    <h2 class="service-title" data-i18n="service.details.title"></h2>
                    <p class="service-description" data-i18n="service.details.description"></p>
                </div>
                <div>
                    <span class="service-price" data-i18n="service.details.price"></span>
                    <span class="service-duration" data-i18n="service.details.duration"></span>
                </div>
                <button class="card-button" data-i18n="service.buttons.buyNow">Buy now</button>
                <button type="button" class="card-button" data-i18n="service.buttons.addToCart">add to cart</button>
            </div>
        </section>
    </main>
    <footer id="footer-placeholder"></footer>
</body>
</html>
