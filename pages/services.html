<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="services.pageTitle">Document</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/header-foter.css">
    <link rel="stylesheet" href="/css/services.css">
    <script src="/js/baseElements/baseElements.js" type="module" ></script>
    <script src="\js\services\services.js" type="module"></script>
</head>
<body>
    <div class="preloader">
        <div class="preloader-content"></div>
    </div>
    <header id="header-placeholder"></header>
    <div id="mobile-menu-placeholder"></div>
    <main>
        <section class="banner-container">
            <div class="banner-container-text">
                <h3 data-i18n="services.banner.subtitle">OUR SERVICES</h3>
                <h1 data-i18n="services.banner.title">Beautyness Services</h1>
            </div>
        </section>
        <section class="services-container">
            <div class="filter-section">
                <div class="filter-options">
                    <select class="card-button" data-i18n="[title]services.filters.sortTitle">
                        <option value="Popular" data-i18n="services.filters.options.popular">Popular</option>
                        <option value="Cheap" data-i18n="services.filters.options.cheap">Cheap</option>
                        <option value="Expensive" data-i18n="services.filters.options.expensive">Expensive</option>
                        <option value="NameAsc" data-i18n="services.filters.options.nameAsc">A–Z</option>
                        <option value="NameDesc" data-i18n="services.filters.options.nameDesc">Z–A</option>
                    </select>
                    <button class="card-button" data-i18n="services.filters.button">Filters</button>
                </div>
                <div class="search-bar">
                    <input type="text" placeholder="SEARCH..." data-i18n="[placeholder]services.search.placeholder">
                </div>
            </div>
            <div class="cards-container">
                <div class="card-grid"></div></div>
            <div class="pagination">
                
            </div>
            <div class="modal" id="filter-modal">
                <div class="modal-content">
                    <span class="close-modal" id="close-modal">&times;</span>
                    <h2 data-i18n="services.modal.title">Filter by Category</h2>
                    <div class="filter-categories">
                        <div class="category-group">
                            <h3 data-i18n="services.modal.category">Category</h3>
                            <div class="categories-container"></div>
                        </div>
                        <div class="category-group">
                            <h3 data-i18n="services.modal.price">Price</h3>
                            <label data-i18n="services.modal.from">From:</label>
                            <input type="number" id="price-from" min="0" class="filter-input">
                            <label data-i18n="services.modal.to">To:</label>
                            <input type="number" id="price-to" min="0" class="filter-input">
                        </div>
                        <div class="category-group">
                            <h3 data-i18n="services.modal.duration">Duration</h3>
                            <label data-i18n="services.modal.fromMin">From (min):</label>
                            <input type="number" id="duration-from" min="0" class="filter-input">
                            <label data-i18n="services.modal.toMin">To (min):</label>
                            <input type="number" id="duration-to" min="0" class="filter-input">
                        </div>
                    </div>
                    <button class="card-button" id="apply-filters" data-i18n="services.modal.applyButton">Apply Filters</button>
                </div>
            </div>
        </section>
    </main>
    <footer id="footer-placeholder"></footer>
</body>
</html>
